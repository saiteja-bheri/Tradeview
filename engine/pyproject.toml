[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "quant-terminal-engine"
version = "0.1.0"
description = "Local read-only quant engine for Quant Terminal"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "sqlalchemy>=2.0",
  "pandas>=2.2",
  "numpy>=2.0",
  "scipy>=1.14",
  "yfinance>=0.2.55",
  "platformdirs>=4.2",
  "python-multipart>=0.0.9",
  "keyring>=25",
  "openpyxl>=3.1",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27"]
# Only needed for Groww (official SDK + TOTP login) and BSE India prices.
# Zerodha and Upstox need nothing extra.
brokers = ["growwapi>=1.0", "pyotp>=2.9", "bse>=3.3"]
build = ["pyinstaller>=6.10"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

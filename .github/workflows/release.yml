# Builds the macOS .dmg (Apple silicon) and the Windows .exe installer on
# GitHub's own machines, then publishes both on a GitHub Release so anyone can
# download them. Nothing is built on a developer's laptop.
#
# Run it by pushing a version tag:   git tag v0.2.0 && git push origin v0.2.0
# or from the Actions tab (Build installers > Run workflow) with a tag name.
name: Build installers

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to create or update, e.g. v0.2.0"
        required: true

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest      # Apple silicon (arm64)
            pattern: "release/*.dmg"
          - os: windows-latest    # 64-bit Windows
            pattern: "release/*.exe"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: npm ci
      - run: npm run engine:setup
      - run: npm run engine:test
      - run: npm run package
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false" # unsigned build; see README
      - uses: actions/upload-artifact@v4
        with:
          name: installer-${{ matrix.os }}
          path: ${{ matrix.pattern }}
          if-no-files-found: error
          retention-days: 7

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write       # create the release and upload the installers
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          ls -l dist
          notes="Quant Terminal ${TAG}: a read-only portfolio analytics terminal. It cannot place, change or cancel orders.

          - macOS (Apple silicon): QuantTerminal-mac-arm64.dmg
          - Windows (64-bit): QuantTerminal-win-x64.exe

          The installers are not code-signed. See the README's Download section for the one-time steps to open them."
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/* --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$TAG" dist/* --repo "$GITHUB_REPOSITORY" --title "Quant Terminal ${TAG}" --notes "$notes" --target "$GITHUB_SHA"
          fi
